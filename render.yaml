# Two services from this one folder: the API and the background worker.
# "sync: false" values are entered in the Render dashboard when the Blueprint is created; never commit them.
services:
  - type: web
    name: vartmaan-api
    runtime: docker
    region: singapore
    plan: starter
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ORG_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_BUCKET
        value: intake
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FTP_PROTOCOL
        sync: false
      - key: FTP_HOST
        sync: false
      - key: FTP_PORT
        sync: false
      - key: FTP_USER
        sync: false
      - key: FTP_PASSWORD
        sync: false
      - key: FTP_BASE_DIR
        sync: false
      - key: SFTP_HOST_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_MAILBOX
        sync: false

  - type: worker
    name: vartmaan-worker
    runtime: docker
    region: singapore
    plan: starter
    dockerCommand: python -m app.worker
    envVars:
      - key: ORG_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_BUCKET
        value: intake
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FTP_PROTOCOL
        sync: false
      - key: FTP_HOST
        sync: false
      - key: FTP_PORT
        sync: false
      - key: FTP_USER
        sync: false
      - key: FTP_PASSWORD
        sync: false
      - key: FTP_BASE_DIR
        sync: false
      - key: SFTP_HOST_KEY
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: MS_TENANT_ID
        sync: false
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_MAILBOX
        sync: false
